[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestor-usuarios"
version = "0.1.0"
description = "Gestor de usuarios desarrollado como proyecto de aprendizaje"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
    "mypy>=1.0"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
